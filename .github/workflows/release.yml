name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/ronfire ronfire-linux-amd64
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ronfire ${{ github.ref_name }}.

            Static files, compiled-in plugins (`proxy` with HTTP(S) upstreams),
            strict HTTP parsing, live range/HEAD finalization.

            **Linux AMD64:** `ronfire-linux-amd64` — also available as
            `ironic06/ronfire:${{ github.ref_name }}` on Docker Hub.
          files: ronfire-linux-amd64

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute version (strip leading v)
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ironic06/ronfire:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
