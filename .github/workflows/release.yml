name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgtest-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/ronfire ronfire-linux-amd64
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ronfire ${{ github.ref_name }}.

            Static files, compiled-in plugins (`proxy` with HTTP(S) upstreams),
            strict HTTP parsing, live range/HEAD finalization.

            **Linux AMD64:** `ronfire-linux-amd64` — also available as
            `ironic06/ronfire:${{ github.ref_name }}` on Docker Hub.
          files: ronfire-linux-amd64

  # Docker images are built and pushed from the deployment host (VPS), not CI,
  # so no registry credentials are needed in this workflow.
